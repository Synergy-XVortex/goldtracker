[build]
  command = "npm run build"
  publish = "dist"
  # Each production deploy uses Netlify credits. Skip the build when a commit does not
  # touch the web app (database migrations, Edge Functions, CI, scripts, docs).
  # Exit code 0 means "nothing to build". To force a deploy, trigger it from the Netlify UI.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html package.json package-lock.json vite.config.ts pwa-assets.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route is served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached, otherwise app updates stop reaching users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
